# Publie l'application sur GitHub Pages à chaque poussée sur la branche
# principale. L'application étant purement statique, il n'y a rien à compiler :
# le dépôt est envoyé tel quel.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  deploiement:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Active GitHub Pages sur le dépôt si ce n'est pas déjà fait.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publication
        uses: actions/deploy-pages@v4
